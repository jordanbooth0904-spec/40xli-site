name: Update official iRacing results

on:
  schedule:
    - cron: '23 */2 * * *'   # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: official-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read iResultBot posts from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 scripts/update_official.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data/official.json)" ]; then
            git config user.name "40XLI results bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/official.json
            git commit -m "Update official results"
            git push
          else
            echo "Nothing new."
          fi
